<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <!-- #18 Security headers: restrict resource loading to extension origin only -->
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; media-src 'self'; img-src 'self'; connect-src 'none'; object-src 'none'; base-uri 'none'; form-action 'none';" />
  <title>Alvaria Segment Alert</title>
  <style>
    /* ── Shared design tokens (light + dark) ── */
    :root {
      --bg:           #F7F8FA;
      --card:         #FFFFFF;
      --border:       #E5E7EB;
      --text:         #17202A;
      --text-muted:   #6B7280;
      --accent:       #2563EB;
      --accent-hover: #1D4ED8;
      --success:      #22C55E;
      --warning:      #F59E0B;
      --danger:       #EF4444;
      --disabled:     #9CA3AF;
      --radius-sm:    8px;
      --radius-md:    12px;
      --radius-lg:    16px;
      --shadow-modal: 0 20px 60px rgba(0,0,0,.18);
      --transition:   120ms ease;
      --font:         -apple-system, "Segoe UI", system-ui, Arial, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:           #111827;
        --card:         #1F2937;
        --border:       #374151;
        --text:         #F9FAFB;
        --text-muted:   #9CA3AF;
        --accent:       #3B82F6;
        --accent-hover: #2563EB;
        --warning:      #F59E0B;
        --danger:       #F87171;
        --disabled:     #6B7280;
        --shadow-modal: 0 20px 60px rgba(0,0,0,.55);
      }
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--font);
      font-size: 14px;
      line-height: 1.5;
      background: var(--bg);
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 16px;
    }

    .card {
      width: min(420px, 100%);
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: var(--shadow-modal);
      padding: 28px 24px 24px;
      text-align: center;
    }

    /* Pulsing bell icon */
    .card__icon {
      font-size: 44px;
      line-height: 1;
      display: block;
      margin-bottom: 16px;
      animation: bellRing 1s ease 0.3s 3;
    }
    @keyframes bellRing {
      0%   { transform: rotate(0deg); }
      15%  { transform: rotate(12deg); }
      30%  { transform: rotate(-10deg); }
      45%  { transform: rotate(8deg); }
      60%  { transform: rotate(-6deg); }
      75%  { transform: rotate(4deg); }
      100% { transform: rotate(0deg); }
    }

    .card__label {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      line-height: 1.2;
    }

    .card__meta {
      font-size: 14px;
      color: var(--text-muted);
      margin-bottom: 4px;
    }

    .card__divider {
      height: 1px;
      background: var(--border);
      margin: 20px 0;
    }

    /* Action buttons */
    .card__actions {
      display: flex;
      gap: 10px;
      justify-content: center;
    }

    .btn {
      all: unset;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 11px 22px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 600;
      font-family: var(--font);
      transition: background var(--transition), opacity var(--transition);
    }
    .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    .btn:disabled { opacity: .45; pointer-events: none; }

    .btn--primary {
      background: var(--accent);
      color: #fff;
    }
    .btn--primary:hover { background: var(--accent-hover); }

    .btn--ghost {
      border: 1px solid var(--border);
      color: var(--text-muted);
    }
    .btn--ghost:hover { background: var(--bg); color: var(--text); }

    /* Countdown ring */
    .countdown-wrap {
      display: flex;
      justify-content: center;
      margin-bottom: 8px;
    }
    .countdown {
      font-size: 11px;
      color: var(--text-muted);
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 99px;
      padding: 3px 10px;
    }
  </style>
</head>
<body>
  <main class="card">
    <span class="card__icon" aria-hidden="true">🔔</span>
    <h1 class="card__label" id="alert-label">Segment alert</h1>
    <p class="card__meta" id="alert-time"></p>
    <p class="card__meta" id="alert-date"></p>
    <div class="card__divider"></div>
    <div class="countdown-wrap">
      <span class="countdown" id="auto-close-label">Auto-closes in 60s</span>
    </div>
    <div class="card__actions">
      <button id="snooze-button" class="btn btn--ghost" type="button">⏱ Snooze 5 min</button>
      <button id="dismiss-button" class="btn btn--primary" type="button">Dismiss</button>
    </div>
    <audio id="alert-audio" preload="auto" src="alert.mp3"></audio>
  </main>
  <script src="alert.js"></script>
</body>
</html>
