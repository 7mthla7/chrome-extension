name: Build iOS IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-ipa:
    name: Build unsigned IPA
    runs-on: macos-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Node.js ────────────────────────────────────────────────
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      # ── 3. Select latest stable Xcode ────────────────────────────────────
      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      # ── 4. Install Capacitor dependencies ────────────────────────────────
      - name: Install npm dependencies
        working-directory: ios-app
        run: npm ci

      # ── 5. Add iOS platform (Capacitor 8 uses SPM — no CocoaPods) ────────
      - name: Add Capacitor iOS platform
        working-directory: ios-app
        run: node node_modules/@capacitor/cli/bin/capacitor add ios

      # ── 6. Sync web assets into the native project ───────────────────────
      - name: Sync web assets
        working-directory: ios-app
        run: node node_modules/@capacitor/cli/bin/capacitor sync ios

      # ── 7. Build unsigned archive (SPM project — use .xcodeproj) ─────────
      - name: Build IPA (unsigned)
        working-directory: ios-app/ios/App
        run: |
          xcodebuild \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination generic/platform=iOS \
            -archivePath "$RUNNER_TEMP/App.xcarchive" \
            archive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            SKIP_INSTALL=NO \
            BUILD_LIBRARY_FOR_DISTRIBUTION=YES

      # ── 8. Package IPA manually (xcodebuild -exportArchive requires a
      #       real Apple Developer signing identity on Xcode 26+; we bypass
      #       it by zipping the .app straight from the archive) ──────────────
      - name: Package IPA
        run: |
          APP=$(find "$RUNNER_TEMP/App.xcarchive/Products/Applications" -name "*.app" | head -1)
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -r "$APP" "$RUNNER_TEMP/ipa/Payload/"
          cd "$RUNNER_TEMP/ipa"
          zip -r "App.ipa" Payload
          echo "=== IPA created ==="
          ls -lh App.ipa

      # ── 9. Upload IPA artifact ────────────────────────────────────────────
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: alarm-ios
          path: ${{ runner.temp }}/ipa/*.ipa
          retention-days: 30
